name: Linux fleet agent
run-name: Linux fleet agent ${{ github.run_number }}

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One running host and at most one waiting replacement.
concurrency:
  group: runners-single-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CONTROL_URL: ${{ vars.CONTROL_URL }}
      JOIN_TOKEN: ${{ secrets.JOIN_TOKEN }}
      SERVER_TAG: github-linux
      MAX_RUNTIME_MINUTES: '345'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check configuration and record the job deadline
        run: |
          python3 scripts/run_agent.py --check
          echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run the fleet agent
        run: python3 -u scripts/run_agent.py

