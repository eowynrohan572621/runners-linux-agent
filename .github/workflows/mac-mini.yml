name: Mac mini agent
run-name: Mac mini agent ${{ github.run_number }}

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One running Mac and, at most, one waiting replacement. New hourly requests
# replace an older waiting request without cancelling the running Mac.
concurrency:
  group: runners-mac-mini
  cancel-in-progress: false

jobs:
  agent:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CONTROL_URL: ${{ vars.CONTROL_URL }}
      JOIN_TOKEN: ${{ secrets.JOIN_TOKEN }}
      SERVER_TAG: github-mac-mini
      MAX_RUNTIME_MINUTES: '345'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check configuration and record the job deadline
        run: |
          python3 scripts/run_agent.py --check
          echo "MAC_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install the Linux Docker VM tools
        run: |
          brew install colima docker qemu lima-additional-guestagents
          colima version
          limactl --version

      - name: Run the fleet agent
        run: python3 -u scripts/run_agent.py

      - name: Stop this job's VM
        if: always()
        timeout-minutes: 3
        run: |
          if command -v colima >/dev/null 2>&1; then
            colima --profile runners-mac-mini stop --force || true
          fi
